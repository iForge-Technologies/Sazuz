name: Publish a verified release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version with a reviewed docs/releases/<version>.md file
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sazuz-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      retain_images: true

  publish:
    name: Publish exact tested platform images
    needs: checks
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download this run's retained architecture, with no rebuild
        env:
          ARCH: ${{ matrix.arch }}
        run: gh run download "$GITHUB_RUN_ID" --name "tested-images-$ARCH" --dir ".verification/release/$ARCH"
      - name: Authenticate registry publishing
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Verify checksums and image IDs before publication
        env:
          ARCH: ${{ matrix.arch }}
        run: pnpm release:images publish "$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-${{ matrix.arch }}
          path: .verification/release/${{ matrix.arch }}/published-${{ matrix.arch }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  release:
    name: Assemble immutable release and checksums
    needs: publish
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - name: Fetch platform digests from this run
        run: |
          gh run download "$GITHUB_RUN_ID" --name published-amd64 --dir .verification/release
          gh run download "$GITHUB_RUN_ID" --name published-arm64 --dir .verification/release
      - name: Authenticate registry publishing
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - run: pnpm release:images assemble
      - name: Publish the source bundle, docs, image inventory and checksums
        run: |
          cd .verification/release/assets
          sha256sum --check SHA256SUMS
          gh release create "v$RELEASE_VERSION" --target "$GITHUB_SHA" --title "Sazuz $RELEASE_VERSION" --notes-file RELEASE-NOTES.md ./*
