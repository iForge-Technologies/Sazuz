x-app: &app
  image: sazuz/app:phase5
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  user: '1000:1000'
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,mode=1777
  pids_limit: 64
  stop_grace_period: 20s
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

x-database-config: &database-config
  SAZUZ_DATA_DIR: /data
  SAZUZ_DATABASE_HOST: postgres
  SAZUZ_DATABASE_PORT: '5432'
  SAZUZ_DATABASE_NAME: sazuz
  SAZUZ_DATABASE_USER: sazuz

services:
  bootstrap:
    <<: *app
    command: [bootstrap]
    environment:
      SAZUZ_DATA_DIR: /data
    network_mode: none
    volumes:
      - type: volume
        source: sazuz_data
        target: /data
    restart: 'no'
    cpus: 0.25
    mem_limit: 128m

  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: sazuz
      POSTGRES_USER: sazuz
      POSTGRES_PASSWORD_FILE: /run/sazuz/secrets/db-password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
      - type: volume
        source: sazuz_data
        target: /run/sazuz
        read_only: true
    networks: [backend]
    read_only: true
    # The official entrypoint reads PASSWORD_FILE as root before switching to
    # postgres; retain only the capabilities needed for that and volume setup.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,size=16m,mode=3775
    healthcheck:
      test: [CMD, pg_isready, --host=127.0.0.1, --username=sazuz, --dbname=sazuz]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 12
    cpus: 1
    mem_limit: 1g
    shm_size: 128m
    pids_limit: 256
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  migrate:
    <<: *app
    command: [migrate]
    environment:
      <<: *database-config
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: volume
        source: sazuz_data
        target: /data
        read_only: true
    networks: [backend]
    restart: 'no'
    cpus: 0.5
    mem_limit: 256m

  server:
    <<: *app
    command: [server]
    environment:
      <<: *database-config
      SAZUZ_SERVER_HOST: 0.0.0.0
      SAZUZ_SERVER_PORT: '7778'
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - type: volume
        source: sazuz_data
        target: /data
      - type: volume
        source: sazuz_workspace
        target: /data/workspace
    networks: [backend, outbound, container_control]
    healthcheck:
      test: [CMD, node, /app/deploy/healthcheck.mjs, server]
      interval: 5s
      timeout: 4s
      start_period: 20s
      retries: 6
    cpus: 0.5
    # Bounded encrypted backup/restore holds an authenticated archive and SQL in memory.
    mem_limit: 2g

  worker:
    <<: *app
    command: [worker]
    environment:
      <<: *database-config
      SAZUZ_SERVER_URL: http://server:7778
      SAZUZ_WORKSPACE_VOLUME: ${COMPOSE_PROJECT_NAME:-sazuz}_sazuz_workspace
      SAZUZ_EGRESS_SOCKET_VOLUME: ${COMPOSE_PROJECT_NAME:-sazuz}_sazuz_egress
    depends_on:
      migrate:
        condition: service_completed_successfully
      sandbox-python:
        condition: service_completed_successfully
      sandbox-node:
        condition: service_completed_successfully
      docker-socket-proxy:
        condition: service_started
      egress-proxy:
        condition: service_started
    volumes:
      - type: volume
        source: sazuz_data
        target: /data
        read_only: true
      - type: volume
        source: sazuz_workspace
        target: /data/workspace
    networks: [backend, outbound, container_control]
    healthcheck:
      test: [CMD, node, /app/dist/worker-healthcheck.js]
      interval: 5s
      timeout: 4s
      start_period: 15s
      retries: 6
    cpus: 0.5
    mem_limit: 256m

  docker-socket-proxy:
    <<: *app
    command: [docker-proxy]
    user: '0:0'
    cap_add: [DAC_READ_SEARCH]
    environment:
      SAZUZ_DATA_DIR: /data
      SAZUZ_WORKSPACE_VOLUME: ${COMPOSE_PROJECT_NAME:-sazuz}_sazuz_workspace
      SAZUZ_EGRESS_SOCKET_VOLUME: ${COMPOSE_PROJECT_NAME:-sazuz}_sazuz_egress
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - type: volume
        source: sazuz_data
        target: /data
        read_only: true
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    networks: [container_control]
    cpus: 0.25
    mem_limit: 128m

  egress-proxy:
    <<: *app
    command: [egress-proxy]
    environment:
      SAZUZ_DATA_DIR: /data
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - type: volume
        source: sazuz_egress
        target: /run/sazuz-egress
      - type: volume
        source: sazuz_data
        target: /data
        read_only: true
    networks: [execution, container_control, outbound]
    cpus: 0.25
    mem_limit: 128m

  sandbox-python:
    image: sazuz/sandbox-python:phase5
    build:
      context: ..
      dockerfile: deploy/images/python.Dockerfile
    command: [python, --version]
    network_mode: none
    read_only: true
    user: '1000:1000'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 16
    mem_limit: 64m
    cpus: 0.25
    restart: 'no'

  sandbox-node:
    image: sazuz/sandbox-node:phase5
    build:
      context: ..
      dockerfile: deploy/images/node.Dockerfile
    command: [node, --version]
    network_mode: none
    read_only: true
    user: '1000:1000'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 16
    mem_limit: 64m
    cpus: 0.25
    restart: 'no'

  browser:
    <<: *app
    image: sazuz/browser:phase5
    build:
      context: ..
      dockerfile: deploy/browser.Dockerfile
    profiles: [browser]
    command: [node, dist/index.js]
    environment:
      <<: *database-config
    depends_on:
      migrate:
        condition: service_completed_successfully
      egress-proxy:
        condition: service_started
    volumes:
      - type: volume
        source: sazuz_data
        target: /data
        read_only: true
    networks: [backend, execution]
    security_opt:
      - no-new-privileges:true
      - seccomp=./browser-seccomp.json
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,mode=1777
    shm_size: 256m
    cpus: 1
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      test: [CMD, node, dist/healthcheck.js]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  whisper:
    image: sazuz/whisper:phase11
    profiles: [voice]
    build:
      context: ..
      dockerfile: deploy/voice/Dockerfile
      args: { ENGINE: whisper }
    command: [python, /app/service.py, --engine, whisper]
    restart: unless-stopped
    read_only: true
    user: '1000:1000'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m,mode=1777']
    networks: [backend]

  piper:
    image: sazuz/piper:phase11
    profiles: [voice]
    build:
      context: ..
      dockerfile: deploy/voice/Dockerfile
      args: { ENGINE: piper }
    command: [python, /app/service.py, --engine, piper]
    restart: unless-stopped
    read_only: true
    user: '1000:1000'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m,mode=1777']
    networks: [backend]

  web:
    <<: *app
    command: [web]
    environment:
      SAZUZ_SERVER_URL: http://server:7778
    depends_on:
      server:
        condition: service_healthy
      worker:
        condition: service_healthy
    networks: [backend]
    ports:
      - target: 7777
        published: '7777'
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: [CMD, node, /app/deploy/healthcheck.mjs, web]
      interval: 5s
      timeout: 4s
      start_period: 15s
      retries: 6
    cpus: 1
    mem_limit: 512m

volumes:
  sazuz_data:
  sazuz_workspace:
  sazuz_egress:
  postgres_data:

networks:
  backend:
    internal: true
  outbound:
  container_control:
    internal: true
  execution:
    internal: true
